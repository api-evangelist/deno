apis:
- aid: deno:runtime-api
  name: Deno Runtime API
  tags:
  - JavaScript
  - Runtime
  - TypeScript
  - WebAssembly
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://docs.deno.com/api/deno/
  properties:
  - url: https://docs.deno.com/api/deno/
    type: Documentation
  - url: json-schema/deno-deployment-schema.json
    type: JSONSchema
  description: >-
    The Deno Runtime API is the built-in namespace of globals and modules available to all programs running
    on the Deno JavaScript and TypeScript runtime. It provides access to filesystem operations, networking,
    process management, cryptography, subprocesses, permissions, and environment variables via the Deno.*
    namespace. The runtime natively supports TypeScript without additional tooling and implements Web
    Platform APIs such as fetch, WebSocket, URL, and Web Crypto.
- aid: deno:kv-api
  name: Deno KV API
  tags:
  - Database
  - Edge
  - Key-Value
  - Storage
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.deno.com
  humanURL: https://docs.deno.com/deploy/kv/
  properties:
  - url: https://docs.deno.com/deploy/kv/
    type: Documentation
  - url: https://docs.deno.com/api/deno/~/Deno.Kv
    type: Documentation
  - url: json-schema/deno-kv-database-schema.json
    type: JSONSchema
  description: >-
    Deno KV is a key-value database built directly into the Deno runtime and available as a globally distributed
    store on Deno Deploy. It is accessed via the Deno.Kv namespace and supports get, set, delete, list,
    and atomic transaction operations. Keys are ordered tuples that support hierarchical data modeling,
    and values can be any structured-serializable JavaScript value including the special Deno.KvU64 type
    for 64-bit unsigned integers.
- aid: deno:standard-library
  name: Deno Standard Library
  tags:
  - Modules
  - Standard Library
  - TypeScript
  - Utilities
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://docs.deno.com/runtime/fundamentals/standard_library/
  properties:
  - url: https://docs.deno.com/runtime/fundamentals/standard_library/
    type: Documentation
  - url: https://jsr.io/@std
    type: Documentation
  description: >-
    The Deno Standard Library is a collection of audited TypeScript modules maintained by the Deno core
    team and published on JSR under the @std scope. It provides common utilities including HTTP server
    helpers, path manipulation, assertions, CSV and JSON parsing, hashing, encoding, streams, date formatting,
    and more. All modules are guaranteed to work with the current stable Deno release and do not rely
    on third-party dependencies.
